name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Шаг 1: Сохраняем секретный ключ во временный файл
      - name: Save SSH Key to file
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      # Шаг 2: Используем этот файл для подключения
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ~/.ssh/vps_key  # <-- ВАЖНО: указываем путь к файлу, а не сам ключ
          script: |
            cd ~/myvault
            git pull origin main
            sudo docker compose up -d --build
            sudo docker image prune -f
